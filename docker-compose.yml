services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
        try { const c = rs.conf(); if (c.members[0].host !== 'mongo:27017') { c.members[0].host = 'mongo:27017'; rs.reconfig(c, {force: true}) } }
        catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }
        db.adminCommand('ping').ok
        "
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/betzone?replicaSet=rs0
    expose:
      - "3001"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongodata:
